name: sallskap

services:
  # No published ports: only Caddy can reach it, over Compose's own network.
  core:
    build: ./core
    image: sallskap-core:local
    restart: unless-stopped
    mem_limit: 768m       # four threads, each with room for one 100 MB password check
    pids_limit: 128
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file: /etc/sallskap/core.env
    volumes:
      - /srv/core:/srv/core
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s    # checked every 2 seconds at first, so `kit` doesn't wait long
      start_interval: 2s

  # Tells other tools about changes to people's access straight away: see
  # core/accounts/sync.py. It's the only container with their admin tokens, so core's
  # web process, which faces the internet, never has them. It publishes no ports.
  sync:
    image: sallskap-core:local   # core's: this has nothing of its own to build
    pull_policy: never
    command: ["python", "manage.py", "sync_tools"]
    restart: unless-stopped
    depends_on:
      core:
        condition: service_healthy   # which has run the migrations
    mem_limit: 128m
    pids_limit: 32
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    env_file:
      - path: /etc/sallskap/sync.env
        required: false   # so `kit link` and the like still work before the first `kit apply` after an upgrade
    volumes:
      - /srv/core:/srv/core
      - ./modules:/modules:ro   # each module's connector
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/alive') > 60)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    mem_limit: 256m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # A folder rather than the file: kit replaces the Caddyfile atomically,
      # and a single-file mount would keep showing the old one.
      - /etc/sallskap/generated:/etc/caddy:ro
      - /srv/website:/srv/website:ro
      - /srv/caddy/data:/data
      - /srv/caddy/config:/config
