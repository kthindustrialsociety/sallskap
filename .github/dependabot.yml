version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /core
    schedule:
      interval: weekly
    ignore:
      # Stay on the Django LTS line until the project chooses to move.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker
    directory: /core
    schedule:
      interval: weekly
    ignore:
      # Django 5.2 supports Python up to 3.14. Move when the project's Django does.
      - dependency-name: python
        versions: [">=3.15"]
  - package-ecosystem: docker-compose
    directory: /   # Caddy
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /modules/git
    schedule:
      interval: weekly
    ignore:
      # Stay on Forgejo's long-term support line until the project chooses to move.
      - dependency-name: "*forgejo*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /modules/vault
    schedule:
      interval: weekly
