name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kit:
    name: Kit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # kit runs on each server's own Python and needs 3.11 or newer.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests

  installer:
    name: Installer lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck install.sh

  core:
    name: Core (in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag sallskap-core:test core
      - name: Run the tests with the same limits as production
        run: >-
          docker run --rm --read-only --tmpfs /tmp --memory 768m --cap-drop ALL
          --security-opt no-new-privileges
          --env SALLSKAP_DOMAIN=example.org
          --env SALLSKAP_DATA_DIR=/tmp
          --env DJANGO_SECRET_KEY="$(openssl rand -hex 32)"
          sallskap-core:test python manage.py test
