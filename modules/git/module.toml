name        = "git"
description = "Code hosting and issues (Forgejo)"
subdomain   = "git"
ram_mb      = 260               # measured: about 215 MB after a burst of clones
requires    = []
data        = ["/srv/git"]
access      = []                # anyone with an account can sign in. Keys decide what they reach: see the README
oidc        = true

# Who gets what in the installation's organisation. Forgejo reads this at someone's
# sign-in, through kit/kit.py, and connector.py acts on it straight away when someone's
# keys change. connector.py maps the rest of the tree: see the README.
admin_group = "operator"
owners      = ["chair", "vice_chair"]  # of an association: owners of its organisation, the root's included

[teams]
operator  = "Owners"
board     = "board"
